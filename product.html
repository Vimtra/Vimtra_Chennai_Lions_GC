<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Product Details · Vimtra Chennai Lions GC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/aos@2.3.1/dist/aos.css">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<link rel="stylesheet" href="assets/lions.css">
<style>
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:#F4F0E8;font-family:Manrope,sans-serif;color:#1A1513;overflow-x:hidden;}
  ::selection{background:#C4202A;color:#fff;}
  .nav-link{font-family:Manrope;font-weight:600;font-size:14px;color:rgba(255,255,255,0.92);text-decoration:none;}
  .nav-link:hover{color:#E9CB8E;}
  .cta-gold{font-family:Manrope;font-weight:700;font-size:13.5px;color:#3A1A06;text-decoration:none;background:linear-gradient(180deg,#E6C57E,#C39A52);padding:11px 20px;border-radius:30px;display:inline-block;border:none;cursor:pointer;}
  .icon-btn{width:42px;height:42px;border-radius:50%;border:1px solid rgba(255,255,255,0.35);background:rgba(255,255,255,0.08);display:flex;align-items:center;justify-content:center;color:#fff;text-decoration:none;cursor:pointer;position:relative;}
  
  .product-detail-grid{display:grid;grid-template-columns:1fr 1.2fr;gap:48px;align-items:start;}
  @media (max-width:900px){.product-detail-grid{grid-template-columns:1fr;gap:32px;}}
  
  .img-card{background:#FBF9F4;border:1px solid rgba(26,21,19,0.07);border-radius:24px;overflow:hidden;aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;position:relative;}
  .img-card::after{content:'';position:absolute;top:0;right:0;width:90px;height:90px;background:linear-gradient(135deg,#E6C57E,#C39A52);clip-path:polygon(100% 0,0 0,100% 100%);opacity:0.9;}
  .img-card .glyph{font-family:Sora;font-weight:800;font-size:120px;color:rgba(255,255,255,0.22);letter-spacing:-0.04em;}
  
  .qty-btn{width:36px;height:36px;border-radius:50%;border:1px solid rgba(26,21,19,0.15);background:transparent;color:#1A1513;font-family:Sora;font-weight:700;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .2s;}
  .qty-btn:hover{background:rgba(26,21,19,0.05);}
  
  .related-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:22px;}
  .product{background:#FBF9F4;border:1px solid rgba(26,21,19,0.07);border-radius:22px;overflow:hidden;display:flex;flex-direction:column;}
  .product .img{aspect-ratio:1/1;background:linear-gradient(160deg,#C9242E,#871119);position:relative;display:flex;align-items:center;justify-content:center;}
  .product .img::after{content:'';position:absolute;top:0;right:0;width:60px;height:60px;background:linear-gradient(135deg,#E6C57E,#C39A52);clip-path:polygon(100% 0,0 0,100% 100%);opacity:0.9;}
  .product .img img{filter:drop-shadow(0 8px 20px rgba(0,0,0,0.3));}
  .product .body{padding:18px 20px 20px;flex:1;display:flex;flex-direction:column;}
  .product h3{margin:0;font-family:Sora;font-weight:700;font-size:16px;letter-spacing:-0.01em;}
  .product .cat{font-family:Manrope;font-weight:700;font-size:10px;letter-spacing:0.16em;color:#C4202A;text-transform:uppercase;}
  .product .price{font-family:Sora;font-weight:800;font-size:22px;color:#1A1513;margin-top:10px;}
  
  .add-btn{padding:13px 22px;border-radius:30px;border:none;background:#1A1513;color:#fff;font-family:Sora;font-weight:700;font-size:13.5px;letter-spacing:0.06em;cursor:pointer;transition:background .2s;}
  .add-btn:hover{background:#C4202A;}
  
  .toast{position:fixed;bottom:24px;right:24px;background:#1A1513;color:#fff;padding:14px 22px;border-radius:14px;font-family:Manrope;font-weight:600;font-size:14px;box-shadow:0 20px 40px -20px rgba(0,0,0,0.5);transform:translateY(120%);transition:transform .35s;z-index:300;}
  .toast.show{transform:translateY(0);}
  .toast .gold{color:#E9CB8E;}
</style>
</head>
<body>

<!-- navbar + overlay injected by lions.js -->

<section style="background:#F4F0E8;padding:60px 32px 96px;">
  <div style="max-width:1200px;margin:0 auto;">
    
    <!-- Breadcrumbs -->
    <div style="margin-bottom:28px;font-family:Manrope;font-size:13px;color:#6B635C;font-weight:600;display:flex;align-items:center;gap:8px;">
      <a href="shop.html" style="color:inherit;text-decoration:none;" class="hover:text-[#C4202A]">Shop</a>
      <span>/</span>
      <span id="breadcrumb-cat" style="color:#C4202A;text-transform:uppercase;letter-spacing:0.04em;">Category</span>
      <span>/</span>
      <span id="breadcrumb-name" style="color:#1A1513;">Product Name</span>
    </div>

    <!-- Main Detail Grid -->
    <div class="product-detail-grid">
      
      <!-- Product Image -->
      <div data-aos="fade-up" class="img-card" id="product-img-container" style="background:linear-gradient(160deg,#C9242E,#871119);">
        <!-- Injected via JavaScript -->
      </div>
      
      <!-- Product Meta -->
      <div data-aos="fade-up" data-aos-delay="100" style="display:flex;flex-direction:column;">
        <span id="product-cat" style="font-family:Manrope;font-weight:700;font-size:11px;letter-spacing:0.2em;color:#C4202A;text-transform:uppercase;">Category</span>
        <h1 id="product-name" style="margin:12px 0 6px;font-family:Sora;font-weight:800;font-size:38px;letter-spacing:-0.027em;line-height:1.1;color:#1A1513;">Product Name</h1>
        
        <div id="product-price" style="font-family:Sora;font-weight:800;font-size:28px;color:#C4202A;margin-top:14px;">₹0</div>
        
        <!-- Divider -->
        <div style="width:100%;height:1px;background:rgba(26,21,19,0.08);margin:24px 0;"></div>
        
        <p id="product-desc" style="margin:0;font-family:Manrope;font-size:15.5px;line-height:1.68;color:#3A1215;opacity:0.85;">Product Description placeholder.</p>
        
        <!-- Order Spec Info from PDF -->
        <div style="margin-top:20px;padding:16px;background:#FBF9F4;border:1px solid rgba(26,21,19,0.06);border-radius:16px;display:flex;flex-direction:column;gap:8px;">
          <div style="display:flex;justify-content:space-between;font-family:Manrope;font-size:13px;color:#6B635C;">
            <span>Order Range:</span>
            <strong style="color:#1A1513;" id="product-range">100 to 500 units</strong>
          </div>
          <div style="display:flex;justify-content:space-between;font-family:Manrope;font-size:13px;color:#6B635C;">
            <span>Bulk Suitability:</span>
            <strong style="color:#1A1513;">Corporate Gifting & Fan Merchandise</strong>
          </div>
        </div>

        <!-- Quantity & Add to Cart -->
        <div style="margin-top:28px;display:flex;align-items:center;gap:22px;flex-wrap:wrap;">
          <div style="display:flex;align-items:center;gap:14px;background:#fff;border:1px solid rgba(26,21,19,0.12);padding:6px 12px;border-radius:30px;">
            <button class="qty-btn" onclick="adjustQty(-1)">-</button>
            <span id="qty-val" style="font-family:Sora;font-weight:700;font-size:16px;min-width:24px;text-align:center;">1</span>
            <button class="qty-btn" onclick="adjustQty(1)">+</button>
          </div>
          <button class="add-btn flex-1" id="add-to-cart-cta">ADD TO CART</button>
        </div>

      </div>
    </div>

    <!-- Related Products -->
    <div style="margin-top:84px;">
      <h2 style="font-family:Sora;font-weight:800;font-size:26px;letter-spacing:-0.02em;margin-bottom:28px;color:#1A1513;">You May Also Like</h2>
      <div class="related-grid" id="related-container">
        <!-- Injected via JavaScript -->
      </div>
    </div>

  </div>
</section>

<div id="toast" class="toast"></div>

<!-- footer injected by lions.js -->

<script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
<script>
let PRODUCTS = [];
let product = null;

// Parse Query Parameter
const urlParams = new URLSearchParams(window.location.search);
const prodId = urlParams.get('id') || 'tshirt-pride';

// Qty Handler
let qty = 1;
function adjustQty(amount) {
  qty = Math.max(1, qty + amount);
  document.getElementById('qty-val').textContent = qty;
}

// Cart Handler
function getCart(){try{return JSON.parse(localStorage.getItem('lions_cart')||'[]');}catch{return [];}}
function setCart(c){localStorage.setItem('lions_cart',JSON.stringify(c));updateBadge();}
function updateBadge(){
  const c=getCart();const n=c.reduce((s,i)=>s+(i.qty||0),0);
  const b=document.getElementById('cartBadge');
  if(b) {
    if(n>0){b.style.display='flex';b.textContent=n;}else{b.style.display='none';}
  }
  if (window.Lions && window.Lions.refresh) window.Lions.refresh();
}

function showToast(n, q){
  const t=document.getElementById('toast');
  t.innerHTML='Added <span style="color:#E9CB8E; font-weight:700;">' + q + ' × ' + n + '</span> to cart';
  t.classList.add('show');
  clearTimeout(window._tt);
  window._tt=setTimeout(()=>t.classList.remove('show'),2200);
}

// Fetch products dynamically from JSON
fetch('assets/products.json')
  .then(res => res.json())
  .then(data => {
    PRODUCTS = data;
    product = PRODUCTS.find(p => p.id === prodId) || PRODUCTS[0];

    // Hydrate DOM
    document.getElementById('breadcrumb-cat').textContent = product.cat;
    document.getElementById('breadcrumb-name').textContent = product.name;
    document.getElementById('product-cat').textContent = product.cat;
    document.getElementById('product-name').textContent = product.name;
    document.getElementById('product-price').textContent = '₹' + product.price.toLocaleString('en-IN');
    document.getElementById('product-desc').textContent = product.desc;
    document.getElementById('product-range').textContent = product.range;

    const imgContainer = document.getElementById('product-img-container');
    if (product.img) {
      imgContainer.innerHTML = `<img src="${product.img}" alt="${product.name}" class="w-full h-full object-cover">`;
    } else {
      imgContainer.innerHTML = `<img src="assets/logo-lion.png" alt="Vimtra Chennai Lions" style="width:50%; height:50%; object-fit:contain; opacity:0.85; filter:drop-shadow(0 8px 24px rgba(0,0,0,0.2));">`;
    }

    // Bind Add to Cart CTA
    document.getElementById('add-to-cart-cta').addEventListener('click', () => {
      const c = getCart();
      const ex = c.find(i => i.id === product.id);
      if(ex){ex.qty += qty;}else{c.push({id: product.id, name: product.name, price: product.price, img: product.img||'', qty: qty});}
      setCart(c);
      showToast(product.name, qty);
    });

    // Hydrate Related Products
    const relatedContainer = document.getElementById('related-container');
    const relatedProducts = PRODUCTS.filter(p => p.id !== product.id).slice(0, 4);
    relatedProducts.forEach((p, i) => {
      const relEl = document.createElement('div');
      relEl.className = 'product';
      relEl.setAttribute('data-aos', 'fade-up');
      relEl.setAttribute('data-aos-delay', i * 60);
      relEl.innerHTML = `
        <a href="product.html?id=${p.id}" class="no-underline text-inherit flex-1 flex flex-col" style="text-decoration:none; color:inherit;">
          <div class="img" style="overflow:hidden; background:linear-gradient(160deg,#C9242E,#871119); display:flex; align-items:center; justify-content:center; aspect-ratio:1/1; padding:24px;">
            ${p.img ? `<img src="${p.img}" alt="${p.name}" class="w-full h-full object-cover">` : `<img src="assets/logo-lion.png" alt="Vimtra Chennai Lions" style="width:60%; height:60%; object-fit:contain; opacity:0.85; filter:drop-shadow(0 8px 24px rgba(0,0,0,0.2));">`}
          </div>
          <div class="body" style="padding:18px 20px 20px; flex:1; display:flex; flex-direction:column;">
            <div class="cat" style="font-family:Manrope; font-weight:700; font-size:10px; letter-spacing:0.16em; color:#C4202A; text-transform:uppercase;">${p.cat}</div>
            <h3 style="margin-top:6px; font-family:Sora; font-weight:700; font-size:16px; letter-spacing:-0.01em;">${p.name}</h3>
            <div class="price" style="font-family:Sora; font-weight:800; font-size:22px; color:#1A1513; margin-top:10px;">₹${p.price.toLocaleString('en-IN')}</div>
          </div>
        </a>`;
      relatedContainer.appendChild(relEl);
    });

    AOS.init({duration:600,once:true,offset:40});
    if (window.AOS) window.AOS.refresh();
    if (window.lucide && window.lucide.createIcons) window.lucide.createIcons();
    updateBadge();
  })
  .catch(err => {
    console.error('Error loading product details:', err);
  });
</script>
<script src="assets/lions.js"></script>
</body>
</html>

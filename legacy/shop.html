<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shop · Vimtra Chennai Lions GC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/aos@2.3.1/dist/aos.css">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<link rel="stylesheet" href="assets/lions.css">
<style>
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:#F4F0E8;font-family:Manrope,sans-serif;color:#1A1513;overflow-x:hidden;}
  ::selection{background:#C4202A;color:#fff;}
  .nav-link{font-family:Manrope;font-weight:600;font-size:14px;color:rgba(255,255,255,0.92);text-decoration:none;}
  .nav-link:hover{color:#E9CB8E;}
  .cta-gold{font-family:Manrope;font-weight:700;font-size:13.5px;color:#3A1A06;text-decoration:none;background:linear-gradient(180deg,#E6C57E,#C39A52);padding:11px 20px;border-radius:30px;display:inline-block;border:none;cursor:pointer;}
  .icon-btn{width:42px;height:42px;border-radius:50%;border:1px solid rgba(255,255,255,0.35);background:rgba(255,255,255,0.08);display:flex;align-items:center;justify-content:center;color:#fff;text-decoration:none;cursor:pointer;position:relative;}
  .cart-badge{position:absolute;top:-4px;right:-4px;background:#E9CB8E;color:#3A1A06;border-radius:50%;font-family:Sora;font-weight:800;font-size:10px;min-width:18px;height:18px;display:flex;align-items:center;justify-content:center;padding:0 4px;}
  .overlay{position:fixed;inset:0;background:rgba(20,8,10,0.96);backdrop-filter:blur(20px);z-index:200;display:none;flex-direction:column;align-items:center;justify-content:center;}
  .overlay.open{display:flex;}
  .overlay a{font-family:Sora;font-weight:700;font-size:34px;color:#fff;text-decoration:none;padding:10px 24px;}
  .overlay a:hover{color:#E9CB8E;}
  .overlay-close{position:absolute;top:24px;right:32px;width:46px;height:46px;border-radius:50%;background:#C4202A;color:#fff;border:none;font-size:22px;cursor:pointer;}
  .product{background:#FBF9F4;border:1px solid rgba(26,21,19,0.07);border-radius:22px;overflow:hidden;display:flex;flex-direction:column;}
  .product .img{aspect-ratio:1/1;background:linear-gradient(160deg,#C9242E,#871119);position:relative;display:flex;align-items:center;justify-content:center;}
  .product .img::after{content:'';position:absolute;top:0;right:0;width:60px;height:60px;background:linear-gradient(135deg,#E6C57E,#C39A52);clip-path:polygon(100% 0,0 0,100% 100%);opacity:0.9;}
  .product .img img{width:50%;height:50%;object-fit:contain;filter:drop-shadow(0 8px 20px rgba(0,0,0,0.3));}
  .product .img .glyph{font-family:Sora;font-weight:800;font-size:72px;color:rgba(255,255,255,0.22);letter-spacing:-0.04em;}
  .product .body{padding:18px 20px 20px;flex:1;display:flex;flex-direction:column;}
  .product h3{margin:0;font-family:Sora;font-weight:700;font-size:16px;letter-spacing:-0.01em;}
  .product .cat{font-family:Manrope;font-weight:700;font-size:10px;letter-spacing:0.16em;color:#C4202A;text-transform:uppercase;}
  .product .price{font-family:Sora;font-weight:800;font-size:22px;color:#1A1513;margin-top:10px;}
  .add-btn{margin-top:14px;padding:11px 16px;border-radius:24px;border:none;background:#1A1513;color:#fff;font-family:Sora;font-weight:700;font-size:12.5px;letter-spacing:0.06em;cursor:pointer;transition:background .2s;}
  .add-btn:hover{background:#C4202A;}
  .add-btn.added{background:linear-gradient(180deg,#E6C57E,#C39A52);color:#3A1A06;}
  .toast{position:fixed;bottom:24px;right:24px;background:#1A1513;color:#fff;padding:14px 22px;border-radius:14px;font-family:Manrope;font-weight:600;font-size:14px;box-shadow:0 20px 40px -20px rgba(0,0,0,0.5);transform:translateY(120%);transition:transform .35s;z-index:300;}
  .toast.show{transform:translateY(0);}
  .toast .gold{color:#E9CB8E;}
</style>
</head>
<body>

<!-- navbar + overlay injected by lions.js -->

<section style="position:relative;background:radial-gradient(125% 105% at 50% -5%,#C9242E 0%,#A8181F 58%,#871119 100%);overflow:hidden;padding:88px 32px 70px;">
  <div style="position:absolute;inset:0;background-image:radial-gradient(circle at 84% 16%,rgba(233,203,142,0.16),transparent 42%);pointer-events:none;"></div>
  <div style="position:relative;max-width:1200px;margin:0 auto;">
    <div data-aos="fade-up" style="font-family:Manrope;font-weight:700;font-size:12px;letter-spacing:0.32em;color:#E9CB8E;text-transform:uppercase;">Vimtra × Lions Pro Gear</div>
    <h1 data-ae="words" data-aos="fade-up" data-aos-easing="ae" style="margin:14px 0 0;font-family:Sora;font-weight:800;font-size:clamp(56px,9.4vw,142px);line-height:0.9;letter-spacing:-0.035em;color:#fff;">SHOP</h1>
    <p data-aos="fade-up" data-aos-delay="100" style="max-width:540px;margin:22px 0 0;font-family:Manrope;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.85);">Official IGPL franchise merchandise. Match-day kit, performance apparel, and tour-tested accessories — engineered for play, built for the gallery.</p>
  </div>
</section>

<section style="background:#F4F0E8;padding:64px 32px 96px;">
  <div style="max-width:1200px;margin:0 auto;">
    <div id="grid" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:22px;"></div>
  </div>
</section>

<div id="toast" class="toast"></div>

<!-- footer injected by lions.js -->

<script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
<script>
AOS.init({duration:600,once:true,offset:40});

let PRODUCTS = [];

function getCart(){try{return JSON.parse(localStorage.getItem('lions_cart')||'[]');}catch{return [];}}
function setCart(c){localStorage.setItem('lions_cart',JSON.stringify(c));updateBadge();}
function updateBadge(){
  const c=getCart();const n=c.reduce((s,i)=>s+(i.qty||0),0);
  const b=document.getElementById('cartBadge');
  if(b) {
    if(n>0){b.style.display='flex';b.textContent=n;}else{b.style.display='none';}
  }
  if (window.Lions && window.Lions.refresh) window.Lions.refresh();
}
function addToCart(id){
  const p=PRODUCTS.find(x=>x.id===id);
  if (!p) return;
  const c=getCart();
  const ex=c.find(i=>i.id===id);
  if(ex){ex.qty++;}else{c.push({id,name:p.name,price:p.price,img:p.img||'',qty:1});}
  setCart(c);
  showToast(p.name);
}
function showToast(n){
  const t=document.getElementById('toast');
  t.innerHTML='Added <span class="gold">'+n+'</span> to cart';
  t.classList.add('show');
  clearTimeout(window._tt);
  window._tt=setTimeout(()=>t.classList.remove('show'),2200);
}

// Fetch products dynamically from JSON
fetch('assets/products.json')
  .then(res => res.json())
  .then(data => {
    PRODUCTS = data;
    const grid=document.getElementById('grid');
    PRODUCTS.forEach((p,i)=>{
      const el=document.createElement('div');
      el.className='product';
      el.setAttribute('data-aos','fade-up');
      el.setAttribute('data-aos-delay',(i%4)*60);
      el.innerHTML=`
        <a href="product.html?id=${p.id}" class="no-underline text-inherit flex-1 flex flex-col" style="text-decoration:none; color:inherit;">
          <div class="img" style="overflow:hidden; background:linear-gradient(160deg,#C9242E,#871119); display:flex; align-items:center; justify-content:center; aspect-ratio:1/1; padding:24px;">
            ${p.img ? `<img src="${p.img}" alt="${p.name}" class="w-full h-full object-cover" style="width:100%; height:100%; object-fit:cover;">` : `<img src="assets/logo-lion.png" alt="Vimtra Chennai Lions" style="width:60%; height:60%; object-fit:contain; opacity:0.85; filter:drop-shadow(0 8px 24px rgba(0,0,0,0.2));">`}
          </div>
          <div class="body" style="padding:18px 20px 0 20px; flex:1; display:flex; flex-direction:column;">
            <div class="cat" style="font-family:Manrope; font-weight:700; font-size:10px; letter-spacing:0.16em; color:#C4202A; text-transform:uppercase;">${p.cat}</div>
            <h3 style="margin:6px 0 0; font-family:Sora; font-weight:700; font-size:16px; letter-spacing:-0.01em;">${p.name}</h3>
            <div class="price" style="font-family:Sora; font-weight:800; font-size:20px; color:#1A1513; margin-top:8px;">₹${p.price.toLocaleString('en-IN')}</div>
          </div>
        </a>
        <div style="padding: 14px 20px 20px 20px;">
          <button class="add-btn w-full" style="width:100%;" onclick="addToCart('${p.id}')">ADD TO CART</button>
        </div>`;
      grid.appendChild(el);
    });
    
    // Refresh animations and icons
    if (window.AOS) window.AOS.refresh();
    if (window.lucide && window.lucide.createIcons) window.lucide.createIcons();
    updateBadge();
  })
  .catch(err => {
    console.error('Error loading products:', err);
    document.getElementById('grid').innerHTML = '<div style="font-family:Manrope; font-size:16px; color:#6B635C; padding:40px; text-align:center;">Could not load products. Please check again later.</div>';
  });

</script>
<script src="assets/lions.js"></script>
</body>
</html>
